<!doctype html>
<html lang="en">
  {% include head.html %}
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    {% include header.html %}

    <main id="main" class="site-main{% if page.url == '/' %} site-main--home{% endif %}">
      {{ content }}
    </main>

    {% include footer.html %}

    {% if page.gallery %}
      <script src="{{ '/assets/js/gallery.js' | relative_url }}" defer></script>
    {% endif %}
  </body>
</html>
